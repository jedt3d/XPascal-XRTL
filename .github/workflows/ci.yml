name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-bootstrap:
    name: Windows bootstrap
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FreePascal 3.3.1
        shell: pwsh
        run: ./tools/install-fpc.ps1

      - name: Check toolchain
        shell: pwsh
        run: ./tools/check-toolchain.ps1

      - name: Install SQLite runtime for XRTL.Database tests
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          & "$vcpkgRoot\vcpkg.exe" install sqlite3:x64-windows
          Add-Content -Path $env:GITHUB_PATH -Value "$vcpkgRoot\installed\x64-windows\bin"

      - name: Build CLI and smoke test
        shell: pwsh
        run: ./tools/run-xpc.ps1 build

      - name: Run CLI smoke checks
        shell: pwsh
        run: |
          ./tools/run-xpc.ps1 build
          ./tools/run-xpc.ps1 version
          ./tools/run-xpc.ps1 doctor
          ./tools/run-xpc.ps1 new sample_app
          ./tools/run-xpc.ps1 build sample_app
          ./sample_app/build/sample_app.exe
          ./build/hello_xpc.exe

      - name: Run XRTL tests
        shell: pwsh
        run: |
          ./build/core_smoke.exe
          ./build/core_result_tests.exe
          ./build/core_option_tests.exe
          ./build/database_smoke.exe
          ./build/database_sqlite_tests.exe
